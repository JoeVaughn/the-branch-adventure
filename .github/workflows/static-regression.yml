name: Static regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/static-check.cjs
      - run: node tests/logic-regression.cjs
